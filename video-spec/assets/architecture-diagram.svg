    <!-- Supported AI Models Pills -->
    <g transform="translate(20, 65)">
      <!-- Claude -->
      <rect width="220" height="50" rx="10" fill="#241B16" stroke="#D97757" stroke-width="1.5" />
      <text x="20" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#D97757">Claude Web</text>
      <text x="145" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">@bridge</text>
    </g>

    <g transform="translate(20, 125)">
      <!-- ChatGPT -->
      <rect width="220" height="50" rx="10" fill="#132420" stroke="#10A37F" stroke-width="1.5" />
      <text x="20" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#10A37F">ChatGPT</text>
      <text x="145" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">MCP tool</text>
    </g>

    <g transform="translate(20, 185)">
      <!-- Gemini -->
      <rect width="220" height="50" rx="10" fill="#1B1E30" stroke="#50C8FF" stroke-width="1.5" />
      <text x="20" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#50C8FF">Google Gemini</text>
      <text x="145" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">Extension</text>
    </g>

    <g transform="translate(20, 245)">
      <!-- DeepSeek -->
      <rect width="220" height="50" rx="10" fill="#152033" stroke="#4D88FF" stroke-width="1.5" />
      <text x="20" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#4D88FF">DeepSeek</text>
      <text x="145" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">Harness</text>
    </g>
  </g>

  <!-- Bottom Flow Arrows / Protocol note -->
  <text x="480" y="500" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1" fill="#8E92A4">
    ◄── Bidirectional JSON-RPC 2.0 Over Server-Sent Events (SSE) ──►
  </text>
</svg>
