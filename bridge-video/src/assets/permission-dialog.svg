<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <filter id="permGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="allowBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF44" />
      <stop offset="100%" stop-color="#D2FF00" />
    </linearGradient>
  </defs>

  <!-- Modal Backdrop -->
  <rect width="640" height="400" fill="#000000" fill-opacity="0.65" rx="24" />

  <!-- Dialog Card -->
  <g transform="translate(40, 20)">
    <rect width="560" height="360" rx="20" fill="#131620" stroke="#2B3244" stroke-width="2" filter="url(#permGlow)" />
    
    <!-- Top Security Warning / Permission Header -->
    <rect width="560" height="64" rx="20" fill="#191E2C" />
    
    <!-- Shield Icon -->
    <g transform="translate(36, 32)">
      <circle cx="0" cy="0" r="16" fill="#1E2816" stroke="#D2FF00" stroke-width="1.5" />
      <path d="M 0,-8 L 8,-4 L 8,3 C 8,7 4,10 0,11 C -4,10 -8,7 -8,3 L -8,-4 Z" fill="none" stroke="#D2FF00" stroke-width="1.8" />
    </g>

    <text x="68" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">
      Tool Permission Requested
    </text>
    <text x="68" y="48" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#D2FF00">
      Bridge MCP Gateway • Local Execution
    </text>

    <!-- Body Description -->
    <text x="36" y="96" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#C5C9D6">
      Claude wants to run local tools inside your sandboxed folder:
    </text>

    <!-- Jailed Folder Path -->
    <rect x="36" y="112" width="488" height="34" rx="8" fill="#0B0D12" stroke="#262C3A" stroke-width="1" />
    <text x="50" y="133" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8E92A4">
      Root Jail: <tspan fill="#D2FF00">c:/tmp/interview</tspan> (Zero parent access)
    </text>

    <!-- Specific Actions Requested -->
    <g transform="translate(36, 160)">
      <rect width="488" height="96" rx="10" fill="#0E1118" stroke="#222836" stroke-width="1" />
      
      <!-- Action 1 -->
      <g transform="translate(16, 24)">
        <circle cx="6" cy="0" r="3" fill="#50C8FF" />
        <text x="18" y="4" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F0F2F8">
          edit_file <tspan fill="#8E92A4">(server.js: replace auth validation logic)</tspan>
        </text>
      </g>

      <!-- Action 2 -->
      <g transform="translate(16, 52)">
        <circle cx="6" cy="0" r="3" fill="#D2FF00" />
        <text x="18" y="4" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F0F2F8">
          pwsh <tspan fill="#8E92A4">("node --test secure-folder-mcp/server.js")</tspan>
        </text>
      </g>

      <!-- Security guarantee -->
      <g transform="translate(16, 80)">
        <text x="0" y="4" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10B981">
          ✓ Symlinks checked  •  Path traversal blocked  •  Isolated process
        </text>
      </g>
    </g>

    <!-- Buttons -->
    <g transform="translate(36, 288)">
      <!-- Deny Button -->
      <rect x="180" y="0" width="120" height="46" rx="10" fill="#181D28" stroke="#2D3446" stroke-width="1.5" />
      <text x="240" y="28" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#8E92A4">
        Deny
      </text>

      <!-- Glowing Allow Button -->
      <rect x="312" y="0" width="212" height="46" rx="10" fill="url(#allowBtn)" filter="url(#permGlow)" />
      <text x="418" y="28" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#000000">
        Allow for Session ✓
      </text>
    </g>
  </g>
</svg>
