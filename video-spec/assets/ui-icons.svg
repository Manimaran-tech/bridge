<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <!-- Clipboard Copy Icon -->
    <g id="icon-clipboard">
      <rect x="6" y="8" width="16" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M 10,8 L 10,5 C 10,4 11,3 12,3 L 16,3 C 17,3 18,4 18,5 L 18,8" fill="none" stroke="currentColor" stroke-width="2" />
      <line x1="10" y1="13" x2="18" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <line x1="10" y1="17" x2="16" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Checkmark Success Circle -->
    <g id="icon-check">
      <circle cx="14" cy="14" r="11" fill="none" stroke="#10B981" stroke-width="2" />
      <path d="M 9,14 L 12.5,17.5 L 19,10.5" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Error Crash Circle -->
    <g id="icon-error">
      <circle cx="14" cy="14" r="11" fill="none" stroke="#EF4444" stroke-width="2" />
      <line x1="10" y1="10" x2="18" y2="18" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" />
      <line x1="18" y1="10" x2="10" y2="18" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Shield Lock -->
    <g id="icon-shield">
      <path d="M 14,3 L 23,7 L 23,14 C 23,19.5 19,23.5 14,25 C 9,23.5 5,19.5 5,14 L 5,7 Z" fill="none" stroke="#D2FF00" stroke-width="2" />
      <circle cx="14" cy="13" r="2.5" fill="#D2FF00" />
      <line x1="14" y1="15" x2="14" y2="18" stroke="#D2FF00" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Lightning Bolt (Fast / Zero Config) -->
    <g id="icon-lightning">
      <path d="M 15,2 L 7,15 L 14,15 L 12,26 L 21,12 L 14,12 Z" fill="#D2FF00" />
    </g>

    <!-- Terminal Prompt -->
    <g id="icon-terminal">
      <rect x="2" y="4" width="24" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M 7,10 L 11,14 L 7,18" fill="none" stroke="#D2FF00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="14" y1="18" x2="19" y2="18" stroke="#D2FF00" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Star (GitHub Star CTA) -->
    <g id="icon-star">
      <path d="M 14,2 L 17.5,9.5 L 25.5,10.5 L 19.5,16 L 21,24 L 14,20 L 7,24 L 8.5,16 L 2.5,10.5 L 10.5,9.5 Z" fill="#D2FF00" />
    </g>
  </defs>
</svg>
