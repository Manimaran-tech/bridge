<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="voltGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF44" />
      <stop offset="50%" stop-color="#D2FF00" />
      <stop offset="100%" stop-color="#9ACC00" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70D8FF" />
      <stop offset="100%" stop-color="#00A2FF" />
    </linearGradient>
    <linearGradient id="wireGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2FF00" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#50C8FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#D2FF00" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card Subtle Vignette -->
  <rect width="800" height="320" rx="24" fill="#0D0E12" fill-opacity="0.95" stroke="#252932" stroke-width="2" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="40" y1="40" x2="760" y2="40" />
    <line x1="40" y1="100" x2="760" y2="100" />
    <line x1="40" y1="160" x2="760" y2="160" />
    <line x1="40" y1="220" x2="760" y2="220" />
    <line x1="40" y1="280" x2="760" y2="280" />
    <line x1="160" y1="20" x2="160" y2="300" />
    <line x1="320" y1="20" x2="320" y2="300" />
    <line x1="480" y1="20" x2="480" y2="300" />
    <line x1="640" y1="20" x2="640" y2="300" />
  </g>

  <!-- Bridge Architectural Vector Graphic -->
  <g transform="translate(140, 18)">
    <!-- Base Water / Depth Glow -->
    <ellipse cx="260" cy="115" rx="240" ry="12" fill="url(#voltGlow)" opacity="0.12" filter="url(#neonBlur)" />
    
    <!-- Horizon Line / Road Deck -->
    <line x1="20" y1="105" x2="500" y2="105" stroke="#414856" stroke-width="4" stroke-linecap="round" />
    <line x1="30" y1="105" x2="490" y2="105" stroke="url(#wireGradient)" stroke-width="2" />
    
    <!-- Suspension Cable Arc (Main Catenary Wires) -->
    <path d="M 30,105 Q 160,35 170,30 Q 260,85 350,30 Q 360,35 490,105" 
          fill="none" stroke="url(#wireGradient)" stroke-width="3" filter="url(#subtleGlow)" />
    <path d="M 30,105 Q 160,40 170,30 Q 260,95 350,30 Q 360,40 490,105" 
          fill="none" stroke="#D2FF00" stroke-width="1.5" opacity="0.8" />

    <!-- Left Tower (Pylon) -->
    <g stroke="url(#voltGlow)" stroke-width="2" fill="none">
      <path d="M 160,115 L 168,25 L 174,25 L 182,115 Z" fill="#14181F" stroke-width="2.5" />
      <line x1="164" y1="45" x2="178" y2="45" stroke="#D2FF00" stroke-width="2" />
      <line x1="162" y1="65" x2="180" y2="65" stroke="#D2FF00" stroke-width="2" />
      <line x1="161" y1="85" x2="181" y2="85" stroke="#D2FF00" stroke-width="2" />
      <line x1="164" y1="45" x2="180" y2="65" stroke="#50C8FF" stroke-width="1.5" opacity="0.6" />
      <line x1="178" y1="45" x2="162" y2="65" stroke="#50C8FF" stroke-width="1.5" opacity="0.6" />
      <line x1="162" y1="65" x2="181" y2="85" stroke="#50C8FF" stroke-width="1.5" opacity="0.6" />
      <line x1="180" y1="65" x2="161" y2="85" stroke="#50C8FF" stroke-width="1.5" opacity="0.6" />
      <!-- Top Beacon -->
      <circle cx="171" cy="22" r="3.5" fill="#D2FF00" filter="url(#subtleGlow)" />
    </g>

    <!-- Right Tower (Pylon) -->
    <g stroke="url(#voltGlow)" stroke-width="2" fill="none">
      <path d="M 340,115 L 348,25 L 354,25 L 362,115 Z" fill="#14181F" stroke-width="2.5" />
      <line x1="344" y1="45" x2="358" y2="45" stroke="#D2FF00" stroke-width="2" />
      <line x1="342" y1="65" x2="360" y2="65" stroke="#D2FF00" stroke-width="2" />
      <line x1="341" y1="85" x2="361" y2="85" stroke="#D2FF00" stroke-width="2" />
      <line x1="344" y1="45" x2="360" y2="65" stroke="#50C8FF" stroke-width="1.5" opacity="0.6" />
      <line x1="358" y1="45" x2="342" y2="65" stroke="#50C8FF" stroke-width="1.5" opacity="0.6" />
      <line x1="342" y1="65" x2="361" y2="85" stroke="#50C8FF" stroke-width="1.5" opacity="0.6" />
      <line x1="360" y1="65" x2="341" y2="85" stroke="#50C8FF" stroke-width="1.5" opacity="0.6" />
      <!-- Top Beacon -->
      <circle cx="351" cy="22" r="3.5" fill="#50C8FF" filter="url(#subtleGlow)" />
    </g>

    <!-- Vertical Stay Wires (Cables to Deck) -->
    <g stroke="#D2FF00" stroke-width="1" opacity="0.5" stroke-dasharray="2,2">
      <!-- Left side drops -->
      <line x1="80" y1="92" x2="80" y2="105" />
      <line x1="120" y1="66" x2="120" y2="105" />
      <!-- Center span drops -->
      <line x1="205" y1="48" x2="205" y2="105" />
      <line x1="230" y1="68" x2="230" y2="105" />
      <line x1="260" y1="85" x2="260" y2="105" stroke="#50C8FF" stroke-width="1.5" opacity="0.8" />
      <line x1="290" y1="68" x2="290" y2="105" />
      <line x1="315" y1="48" x2="315" y2="105" />
      <!-- Right side drops -->
      <line x1="400" y1="66" x2="400" y2="105" />
      <line x1="440" y1="92" x2="440" y2="105" />
    </g>

    <!-- Center Bridge Quantum MCP Portal Core -->
    <g transform="translate(260, 85)">
      <circle cx="0" cy="0" r="14" fill="#000000" stroke="#50C8FF" stroke-width="2.5" filter="url(#subtleGlow)" />
      <circle cx="0" cy="0" r="8" fill="url(#cyanGlow)" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
      <!-- Data Pulses -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#D2FF00" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
    </g>
  </g>

  <!-- Typography Block -->
  <g transform="translate(400, 215)" text-anchor="middle">
    <!-- Main Title -->
    <text y="0" font-family="'JetBrains Mono', 'Inter', -apple-system, monospace" font-size="64" font-weight="900" letter-spacing="12" fill="#D2FF00" filter="url(#subtleGlow)">
      BRIDGE
    </text>
    
    <!-- Badge Line -->
    <g transform="translate(0, 32)">
      <!-- Pill background -->
      <rect x="-240" y="0" width="480" height="28" rx="14" fill="#1C212B" stroke="#323846" stroke-width="1.5" />
      <text y="18" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#F0F2F8">
        UNIVERSAL LOCAL-TO-WEB AI HARNESS
      </text>
    </g>

    <!-- Subtitle protocol metadata -->
    <text y="82" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" letter-spacing="2" fill="#8E92A4">
      MCP  •  CLOUDFLARE ANYCAST TUNNEL  •  STRICT JAIL
    </text>
  </g>
</svg>
