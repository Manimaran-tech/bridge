<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171F" />
      <stop offset="50%" stop-color="#0B0C0E" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="iconVolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2FF66" />
      <stop offset="100%" stop-color="#D2FF00" />
    </linearGradient>
    <linearGradient id="iconCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60D4FF" />
      <stop offset="100%" stop-color="#0091FF" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle / Rounded Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#iconBg)" stroke="#262B36" stroke-width="4" />
  
  <!-- Subtle Internal Glow border -->
  <rect x="22" y="22" width="468" height="468" rx="106" fill="none" stroke="#D2FF00" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Diagonal Cyber Accent line -->
  <line x1="32" y1="480" x2="480" y2="32" stroke="#D2FF00" stroke-width="1" stroke-opacity="0.08" />

  <!-- Stylized Monogram 'B' / Suspension Bridge Geometric Icon -->
  <g transform="translate(64, 80)">
    <!-- Bridge Pylons (Geometric A-Frames) -->
    <!-- Left Pylon -->
    <path d="M 60,280 L 100,50 L 130,50 L 170,280 Z" fill="#1A1E27" stroke="url(#iconVolt)" stroke-width="6" />
    <line x1="85" y1="130" x2="145" y2="130" stroke="#D2FF00" stroke-width="5" />
    <line x1="75" y1="200" x2="155" y2="200" stroke="#D2FF00" stroke-width="5" />
    
    <!-- Right Pylon -->
    <path d="M 214,280 L 254,50 L 284,50 L 324,280 Z" fill="#1A1E27" stroke="url(#iconVolt)" stroke-width="6" />
    <line x1="239" y1="130" x2="299" y2="130" stroke="#D2FF00" stroke-width="5" />
    <line x1="229" y1="200" x2="309" y2="200" stroke="#D2FF00" stroke-width="5" />

    <!-- Deck Platform -->
    <line x1="10" y1="240" x2="374" y2="240" stroke="#373D4D" stroke-width="10" stroke-linecap="round" />
    <line x1="10" y1="240" x2="374" y2="240" stroke="url(#iconCyan)" stroke-width="4" stroke-linecap="round" />

    <!-- Catenary Cables -->
    <path d="M 10,240 Q 90,90 115,50 Q 192,190 269,50 Q 294,90 374,240" 
          fill="none" stroke="url(#iconVolt)" stroke-width="6" filter="url(#iconGlow)" />
    
    <!-- Vertical Stay Wires -->
    <g stroke="#D2FF00" stroke-width="3" opacity="0.6" stroke-dasharray="4,4">
      <line x1="150" y1="110" x2="150" y2="240" />
      <line x1="192" y1="170" x2="192" y2="240" stroke="#50C8FF" stroke-width="4" opacity="0.9" />
      <line x1="234" y1="110" x2="234" y2="240" />
    </g>

    <!-- Center Pulse Core (Local to Web AI Quantum Gate) -->
    <circle cx="192" cy="170" r="18" fill="#000000" stroke="#50C8FF" stroke-width="5" filter="url(#iconGlow)" />
    <circle cx="192" cy="170" r="9" fill="url(#iconVolt)" />
  </g>

  <!-- Bottom Badge: "B R I D G E" -->
  <text x="256" y="435" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="900" letter-spacing="8" fill="#FFFFFF">
    BRIDGE
  </text>
  <circle cx="150" cy="425" r="4" fill="#D2FF00" />
  <circle cx="362" cy="425" r="4" fill="#D2FF00" />
</svg>
