<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="100%" height="100%">
  <defs>
    <filter id="modalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="connectBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF44" />
      <stop offset="100%" stop-color="#D2FF00" />
    </linearGradient>
  </defs>

  <!-- Modal Backdrop Dim -->
  <rect width="640" height="440" fill="#000000" fill-opacity="0.6" rx="24" />

  <!-- Dialog Card -->
  <g transform="translate(40, 20)">
    <rect width="560" height="400" rx="20" fill="#141720" stroke="#2D3344" stroke-width="2" filter="url(#modalGlow)" />
    
    <!-- Header -->
    <rect width="560" height="60" rx="20" fill="#1B202D" />
    <!-- Icon -->
    <circle cx="36" cy="30" r="14" fill="#D2FF00" fill-opacity="0.2" stroke="#D2FF00" stroke-width="1.5" />
    <path d="M 32,30 L 35,33 L 41,27" fill="none" stroke="#D2FF00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="64" y="35" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
      Add Custom MCP Server
    </text>
    
    <!-- Close X -->
    <text x="526" y="35" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#8E92A4">✕</text>

    <!-- Subtitle -->
    <text x="36" y="92" font-family="'Inter', sans-serif" font-size="12" fill="#8E92A4">
      Connect your local development environment using the Model Context Protocol endpoint.
    </text>

    <!-- Form Field 1: Name -->
    <text x="36" y="128" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0F2F8">
      Server Name
    </text>
    <rect x="36" y="138" width="488" height="44" rx="10" fill="#0E1017" stroke="#2B3142" stroke-width="1.5" />
    <text x="52" y="165" font-family="'JetBrains Mono', monospace" font-size="14" fill="#FFFFFF">
      Bridge
    </text>

    <!-- Form Field 2: MCP Endpoint URL -->
    <text x="36" y="214" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0F2F8">
      Server Endpoint URL (SSE / HTTP)
    </text>
    <rect x="36" y="224" width="488" height="44" rx="10" fill="#0E1017" stroke="#D2FF00" stroke-width="2" />
    <text x="52" y="251" font-family="'JetBrains Mono', monospace" font-size="13" fill="#D2FF00">
      https://quantum-edge-842.trycloudflare.com/mcp
    </text>
    <!-- Copied / Verified badge -->
    <rect x="440" y="233" width="72" height="26" rx="6" fill="#1E2A12" stroke="#D2FF00" stroke-width="1" />
    <text x="476" y="250" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#D2FF00">
      PASTED
    </text>

    <!-- Capabilities Checkboxes -->
    <g transform="translate(36, 290)">
      <circle cx="8" cy="8" r="8" fill="#10B981" />
      <path d="M 5,8 L 7,10 L 11,6" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
      <text x="24" y="12" font-family="'Inter', sans-serif" font-size="11" fill="#8E92A4">
        Supports tools: <tspan fill="#F0F2F8">read_file, edit_file, pwsh, bash, jobs, plan_mode</tspan>
      </text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(36, 336)">
      <!-- Cancel Button -->
      <rect x="260" y="0" width="100" height="42" rx="10" fill="#1B202C" stroke="#2B3244" stroke-width="1.5" />
      <text x="310" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#8E92A4">
        Cancel
      </text>

      <!-- Connect Button -->
      <rect x="372" y="0" width="152" height="42" rx="10" fill="url(#connectBtn)" />
      <text x="448" y="26" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#000000">
        Connect Server
      </text>
    </g>
  </g>
</svg>
